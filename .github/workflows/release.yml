name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skills
        run: npm run validate

      - name: Determine release version
        id: version
        shell: bash
        run: |
          git fetch --force --tags

          version="$(node -e "try { const { version } = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); process.stdout.write(typeof version === 'string' ? version : ''); } catch {}")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping release: package.json version must be strict x.y.z; found '${version:-missing}'."
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_major="${BASH_REMATCH[1]}"
          version_minor="${BASH_REMATCH[2]}"
          version_patch="${BASH_REMATCH[3]}"
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)

          if [[ -n "$latest_tag" ]]; then
            [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            latest_major="${BASH_REMATCH[1]}"
            latest_minor="${BASH_REMATCH[2]}"
            latest_patch="${BASH_REMATCH[3]}"

            if ! (( 10#$version_major > 10#$latest_major || (10#$version_major == 10#$latest_major && 10#$version_minor > 10#$latest_minor) || (10#$version_major == 10#$latest_major && 10#$version_minor == 10#$latest_minor && 10#$version_patch > 10#$latest_patch) )); then
              echo "Skipping release: v$version is not higher than existing highest tag $latest_tag."
              printf 'publish=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          printf 'tag=v%s\npublish=true\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk '
            $0 == "## " version || index($0, "## " version " - ") == 1 {
              found=1
              next
            }
            found && /^## / {
              exit
            }
            found {
              print
            }
          ' version="$TAG" CHANGELOG.md > /tmp/release-notes.md

          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            printf 'SJinn skills release %s.\n' "$TAG" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file /tmp/release-notes.md
